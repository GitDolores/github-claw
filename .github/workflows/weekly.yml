name: Weekly Update

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-analyze all projects (ignore cache)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    # worst-case retry schedule: 3×5min + 3×60min ≈ 3.4h per repo
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rotate featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/weekly.mjs

      - name: Analyze new featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: node tools/analyze.mjs $FORCE_FLAG

      - name: Generate category summary
        run: node tools/summarize.mjs

      - name: Commit weekly update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "chore(weekly): rotate featured projects and refresh summary [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Trigger Pages redeploy
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: pages.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
